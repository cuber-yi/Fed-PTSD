seed: 9

federation:
  num_rounds: 50
  local_epochs: 5
  batch_size: 32

training:
  lr: 0.001
  optimizer: 'adam'

model:
  name: 'dlinear'    #'xpatch', 'rnn', 'lstm', 'gru', 'mlp', 'dlinear', 'pyraformer',
                      #'fedformer', 'timesnet', 'patchtst'
  pfl_enabled: true

results:
  save_dir_prefix: 'result/'

privacy:
  enabled: true
  clipping_norm: 1.5
  noise_sigma:
    seasonal: 0.001
    trend: 0.005

aggregation:
  name: 'fedavg'  # 'fedavg', 'fedprox'
  mu: 0.01

clustering:
  enabled: false
  method: 'kmeans'  # 可选: 'kmeans', 'gmm', 'spectral'
  num_clusters: 6
  eps: 0.5
  min_samples: 2
  recluster_every_n_rounds: 10
  affinity: 'nearest_neighbors'
  n_neighbors: 5


